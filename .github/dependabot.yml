# https://docs.github.com/en/code-security/dependabot
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#configuration-options-for-the-dependabotyml-file

version: 2
updates:

  - package-ecosystem: "github-actions"
    commit-message:
      # Prefix all commit messages with "chore(actions): "
      prefix: "chore(actions): "
    directory: "/"
    schedule:
      # Runs once each month. This is on the first day of the month.
      interval: "monthly"
      # Runs once each week. By default, this is on Monday. To modify this, use `schedule.day`.
      #interval: "weekly"
      #day: "tuesday"
    labels:
      - "actions:dependabot"
      - "type:chore"
      - "impacts:workflows"
    pull-request-branch-name:
      # Separate sections of the branch name with a hyphen
      separator: "-"
    groups:
      docker:
        patterns:
        - "docker*"
      rwaight:
        patterns:
        - "rwaight*"
    reviewers:
      - "rwaight"

  # Composite action.yml files live outside .github/workflows/.
  # Dependabot only scans those directories when they are listed here.
  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "chore(actions): "
    directories:
      - "/github/check-semver-labels"
      - "/test/build-matrix"
      - "/test/bump-json-version"
      - "/test/config-gh-cli"
      - "/test/get-commit-hash"
      - "/vars/build-method"
      - "/vars/build-type"
      - "/vars/build-version"
    schedule:
      interval: "monthly"
    labels:
      - "actions:dependabot"
      - "type:chore"
      - "impacts:workflows"
    pull-request-branch-name:
      separator: "-"
    reviewers:
      - "rwaight"
