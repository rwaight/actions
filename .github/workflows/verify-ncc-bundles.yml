# Rebuild committed JS bundles (ncc / similar) and fail if the output differs.
# An action joins the allowlist in the same PR that first rebuilds it
# (lockfile + the script that emits dist/ or lib/).
# This check is not required.

name: Verify ncc bundles
run-name: Rebuild committed JS bundles on ${{ github.event_name }}

on:
  pull_request:
    # Explicit types (default is [opened, synchronize, reopened]):
    types:
      - opened
      - synchronize  # new commits pushed to the PR branch
      - reopened
    paths:
      - '.github/workflows/verify-ncc-bundles.yml'
      - '.github/ncc-verify-allowlist.yml'
      - 'git/changed-files/**'
      - 'github/export-label-config/**'

permissions:
  contents: read

# Cancel in-progress runs on rapid re-pushes.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.actor != 'rw-actions-bot[bot]' }}

jobs:

  verify:
    name: Rebuild allowlisted bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Not a required check. The allowlist names the bundles this job rebuilds.
    steps:

      - name: Checkout files from commit tree
        # Verified creator: https://github.com/marketplace/actions/checkout
        # GitHub Action for checking out a repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Install and build scripts come from the PR. Do not leave the
          # GITHUB_TOKEN in .git/config while those scripts run.
          persist-credentials: false

      - name: Read ncc verify allowlist
        id: allowlist
        run: |
          echo "::group::starting the 'allowlist' step... "
          set -euo pipefail
          echo "reading '.github/ncc-verify-allowlist.yml' with yq. "
          count="$(yq e '.actions | length' .github/ncc-verify-allowlist.yml)"
          echo "allowlist action count is ${count}. "
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          echo ""

      - name: Skip empty allowlist
        id: skip-empty
        if: steps.allowlist.outputs.count == '0'
        run: |
          echo "::group::starting the 'skip-empty' step... "
          echo "the allowlist is empty; no bundles to verify. "
          echo "an action joins this list in the same PR that first rebuilds it. "
          echo "::endgroup::"
          echo ""

      - name: Setup Node.js environment
        id: setup-node
        if: steps.allowlist.outputs.count != '0'
        # Verified creator: https://github.com/marketplace/actions/setup-node-js-environment
        # Set up your GitHub Actions workflow with a specific version of node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Yarn Classic for changed-files. Do not shim npm; setup-node already provides it.
      - name: Enable Corepack Yarn
        id: enable-corepack
        if: steps.allowlist.outputs.count != '0'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          echo "::group::starting the 'enable-corepack' step... "
          echo "enabling the Corepack yarn shim only. "
          corepack enable yarn
          echo "::endgroup::"
          echo ""

      - name: Rebuild each allowlisted action
        id: rebuild-bundles
        if: steps.allowlist.outputs.count != '0'
        run: |
          set -euo pipefail
          echo "::group::starting the 'rebuild-bundles' step... "
          echo "rebuilding each allowlisted action and comparing the committed output. "
          python3 - <<'PY'
          import json, os, subprocess

          actions = json.loads(subprocess.check_output(
              ["yq", "e", "-o=json", ".actions", ".github/ncc-verify-allowlist.yml"],
              text=True,
          ))
          for item in actions:
              path = item["path"]
              scripts = item.get("scripts")
              if scripts is None:
                  scripts = [item.get("script", "package")]
              if not isinstance(scripts, list) or not scripts:
                  raise SystemExit(f"{path}: set script: or a non-empty scripts: list")
              output = item.get("output", "dist")
              installer = item.get("installer")
              if installer is None:
                  installer = "yarn" if os.path.exists(os.path.join(path, "yarn.lock")) else "npm"
              if installer not in ("npm", "yarn"):
                  raise SystemExit(f"{path}: unknown installer {installer!r} (expected npm or yarn)")
              print(
                  f"verifying '{path}' via '{installer} run {' && '.join(scripts)}' "
                  f"and comparing '{path}/{output}/'. "
              )
              if installer == "yarn":
                  if not os.path.exists(os.path.join(path, "yarn.lock")):
                      raise SystemExit(f"{path} is missing yarn.lock")
                  subprocess.check_call(["yarn", "install", "--frozen-lockfile"], cwd=path)
                  for name in scripts:
                      subprocess.check_call(["yarn", "run", name], cwd=path)
              else:
                  if not os.path.exists(os.path.join(path, "package-lock.json")):
                      raise SystemExit(f"{path} is missing package-lock.json")
                  subprocess.check_call(["npm", "ci"], cwd=path)
                  for name in scripts:
                      subprocess.check_call(["npm", "run", name], cwd=path)
              output_path = f"{path}/{output}"
              dirty = subprocess.check_output(
                  ["git", "status", "--porcelain", "-uall", "--", output_path],
                  text=True,
              )
              if dirty:
                  subprocess.call(["git", "diff", "--", output_path])
                  raise SystemExit(
                      f"{output_path} does not match the rebuild:\n{dirty}"
                      f"run '{' && '.join([installer+' run '+s for s in scripts])}' "
                      f"and commit {output_path}/"
                  )
          PY
          echo "::endgroup::"
          echo ""
