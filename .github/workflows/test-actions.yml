name: Test Actions
run-name: Run action smokes on ${{ github.event_name }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      builders: ${{ steps.filter.outputs.builders }}
      chatops: ${{ steps.filter.outputs.chatops }}
      git: ${{ steps.filter.outputs.git }}
      github: ${{ steps.filter.outputs.github }}
      vars: ${{ steps.filter.outputs.vars }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Filter changed action paths
        uses: ./utilities/paths-filter
        id: filter
        with:
          filters: |
            builders:
              - 'builders/**'
            chatops:
              - 'chatops/**'
            git:
              - 'git/**'
            github:
              - 'github/**'
            vars:
              - 'vars/**'

  builders:
    needs: changes
    if: ${{ needs.changes.outputs.builders == 'true' || needs.changes.outputs.vars == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Smoke vars/build-version (simple)
        id: simple
        uses: ./vars/build-version
        with:
          strategy: simple
          verbose: true
      - name: Smoke vars/build-version (wildcard)
        id: wildcard
        uses: ./vars/build-version
        with:
          strategy: wildcard
          verbose: true
      - name: Assert build-version outputs
        run: |
          set -euo pipefail
          test -n "${{ steps.simple.outputs.build-version }}"
          test -n "${{ steps.wildcard.outputs.build-version }}"
          echo "simple=${{ steps.simple.outputs.build-version }}"
          echo "wildcard=${{ steps.wildcard.outputs.build-version }}"

  chatops:
    needs: changes
    if: ${{ needs.changes.outputs.chatops == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Look for an existing comment
        uses: ./chatops/find-comment
        id: existing-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: This comment was written and updated by a bot!
      - name: Create comment
        if: steps.existing-comment.outputs.comment-id == ''
        uses: ./chatops/create-or-update-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            This comment was written by a bot!
      - name: Update comment
        if: steps.existing-comment.outputs.comment-id != ''
        uses: ./chatops/create-or-update-comment
        with:
          comment-id: ${{ steps.existing-comment.outputs.comment-id }}
          body: |
            This comment was written and updated by a bot!

  git:
    needs: changes
    if: ${{ needs.changes.outputs.git == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Smoke git/changed-files
        id: changed-files
        uses: ./git/changed-files
      - name: Assert changed-files outputs
        env:
          ANY_CHANGED: ${{ steps.changed-files.outputs.any_changed }}
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -euo pipefail
          test -n "${ANY_CHANGED}"
          echo "any_changed=${ANY_CHANGED}"
          echo "all_changed_files=${ALL_CHANGED_FILES}"

  github:
    needs: changes
    if: ${{ needs.changes.outputs.github == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Smoke github/export-label-config
        uses: ./github/export-label-config
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          raw-result: false
          add-aliases: true

  tests-complete:
    needs: [changes, builders, chatops, git, github]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Smokes finished
        run: echo "Selected action smokes completed."
